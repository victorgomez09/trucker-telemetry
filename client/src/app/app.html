<div class="drawer lg:drawer-open h-screen bg-base-300">
  <input id="main-sidebar" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col overflow-hidden">
    
    <div class="lg:hidden navbar bg-base-100 shadow-md px-4">
      <label for="main-sidebar" class="btn btn-square btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="w-6 h-6 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </label>
      <div class="flex-1 px-2 font-black italic">Trucker Client</div>
    </div>

    <div class="flex-grow overflow-y-auto p-4 md:p-8 custom-scroll">
      
      @if (!isConnected()) {
        <div class="hero min-h-[70vh] bg-base-200 rounded-3xl shadow-inner">
          <div class="hero-content text-center">
            <div class="max-w-md">
              <span class="loading loading-infinity loading-lg text-primary"></span>
              <h1 class="text-3xl font-black italic mt-4 uppercase">Trucker client</h1>
              <p class="py-6 opacity-70">Esperando conexión con el simulador...</p>
            </div>
          </div>
        </div>
      } @else {
        <div class="animate-in fade-in duration-500">
          <router-outlet></router-outlet>
        </div>
      }
      
    </div>
  </div>

  <div class="drawer-side z-50">
    <label for="main-sidebar" class="drawer-overlay"></label>
    <div class="menu p-4 w-72 h-full bg-base-100 text-base-content border-r border-base-content/5 flex flex-col">
      
      <div class="flex items-center gap-4 px-4 mb-10 mt-2">
        <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-primary-content font-black italic shadow-lg shadow-primary/20">
          TC
        </div>
        <div class="flex flex-col">
          <span class="font-black italic text-xl tracking-tighter leading-none">Trucker client</span>
          <span class="text-[10px] uppercase font-bold opacity-40 tracking-widest">Fleet Systems</span>
        </div>
      </div>

      <ul class="space-y-2 flex-grow">
        <li class="menu-title opacity-40 text-[10px] font-black uppercase tracking-widest">Menú Principal</li>
        
        <li>
          <a routerLink="/telemetry" routerLinkActive="active" class="flex items-center gap-4 py-3 rounded-2xl font-bold transition-all">
            <span class="text-xl">📊</span> 
            Telemetría
            @if (hasJob() && isConnected()) {
              <span class="badge badge-primary badge-xs animate-pulse"></span>
            }
          </a>
        </li>

        <li>
          <a routerLink="/radio" routerLinkActive="active" class="flex items-center gap-4 py-3 rounded-2xl font-bold transition-all">
            <span class="text-xl">📻</span> 
            Truck Radio
            @if (radioIsPlaying()) {
              <span class="loading loading-waveform loading-xs"></span>
            }
          </a>
        </li>

        <!-- <li class="menu-title opacity-40 text-[10px] font-black uppercase tracking-widest mt-6">Logística</li>
        <li>
          <a routerLink="/history" routerLinkActive="active" class="flex items-center gap-4 py-3 rounded-2xl font-bold opacity-50 italic">
            <span class="text-xl">📜</span> 
            Historial (Pronto)
          </a>
        </li> -->
      </ul>
    </div>
  </div>
</div>
