<div class="card bg-base-100 shadow-xl p-2">
  <h2 class="card-title">Truck Wheels Details</h2>
  <div class="grid grid-cols-4 gap-2 mt-2">
    @for (wheel of telemetry().wheels; track $index) {
        <div class="p-2 bg-base-200 rounded">
          <p>Suspension: {{ wheel.suspension }}</p>
          <p>Velocity: {{ wheel.velocity }}</p>
          <p>Steering: {{ wheel.steering }}</p>
          <p>Lift: {{ wheel.lift }}</p>
        </div>
    }
  </div>
</div>
