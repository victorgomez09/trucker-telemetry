<div class="flex justify-between bg-base-200 p-2 shadow">
    <div class="flex gap-4">
      <span class="font-bold text-xl">{{ telemetry().truck_speed | number }} km/h</span>
      <span>RPM: {{ telemetry().truck_rpm | number }}</span>
      <span>Gear: {{ telemetry().truck_gear }}</span>
    </div>
    <div class="flex gap-2">
      <span class="badge badge-info">Fuel: {{ telemetry().fuel | number }}/{{ telemetry().fuel_capacity | number }}</span>
      <span class="badge badge-warning">AdBlue: {{ telemetry().adblue | number }}</span>
    </div>
  </div>
