<div class="flex items-center justify-center h-screen">
  <div class="card w-96 bg-base-200 shadow-xl p-6">
    <h2 class="text-xl font-bold mb-4">Configuración inicial</h2>

    <label class="label">ETS2 Path</label>
    <input class="input input-bordered"
           [(ngModel)]="ets2Path" />

    <label class="label mt-2">ATS Path (opcional)</label>
    <input class="input input-bordered"
           [(ngModel)]="atsPath" />

    <button class="btn btn-primary mt-4"
            (click)="save()">
      Guardar
    </button>
  </div>
</div>
