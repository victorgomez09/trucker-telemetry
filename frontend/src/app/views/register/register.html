<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-2xl bg-base-100 shadow-xl overflow-hidden">
    <div class="flex flex-col lg:flex-row">
      <div class="bg-primary p-8 text-primary-content lg:w-1/3 flex flex-col justify-center gap-4">
        <h3 class="text-2xl font-black uppercase italic">Únete a la Flota</h3>
        <ul class="steps steps-vertical text-sm">
          <li class="step step-primary font-bold">Cuenta</li>
          <li class="step">VTC Setup</li>
          <li class="step">Ready!</li>
        </ul>
      </div>

      <div class="card-body lg:w-2/3">
        <h2 class="card-title text-2xl font-black mb-4">Registro de Conductor</h2>
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-4">
          <div class="grid grid-cols-1 gap-4">
            <label class="input input-bordered flex items-center gap-2" [ngClass]="{'input-error': registerForm.controls['username'].touched && registerForm.controls['username'].errors}">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.471Z" /></svg>
              <input type="text" formControlName="username" class="grow" placeholder="Nombre de usuario" />
            </label>

            <label class="input input-bordered flex items-center gap-2" [ngClass]="{'input-error': registerForm.controls['password'].touched && registerForm.controls['password'].errors}">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z" clip-rule="evenodd" /></svg>
              <input type="password" formControlName="password" class="grow" placeholder="Contraseña segura" />
            </label>
          </div>

          <div class="form-control">
            <label class="label cursor-pointer justify-start gap-4">
              <input type="checkbox" checked="checked" class="checkbox checkbox-primary checkbox-sm" />
              <span class="label-text">Acepto las normas de la comunidad VTC</span>
            </label>
          </div>

          <div class="card-actions justify-end mt-6">
            <button class="btn btn-ghost" type="button" routerLink="/login">Ya tengo cuenta</button>
            <button class="btn btn-primary px-8 font-black uppercase" type="submit" [disabled]="registerForm.invalid">Registrarme</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
