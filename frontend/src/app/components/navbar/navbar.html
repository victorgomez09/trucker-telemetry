<div 
  class="navbar fixed top-0 z-50 transition-all duration-300 px-4 md:px-8"
  [ngClass]="isScrolled() ? 'bg-base-100/80 backdrop-blur-md shadow-lg py-2' : 'bg-transparent py-4'"
>
  <div class="navbar-start">
    <div class="dropdown lg:hidden">
      <label tabindex="0" class="btn btn-ghost btn-circle">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
      </label>
      <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-1 p-2 shadow bg-base-200 rounded-box w-52 border border-white/5">
        <li><a routerLink="/" routerLinkActive="active">Panel</a></li>
        <li><a routerLink="/jobs" routerLinkActive="active">Historial</a></li>
      </ul>
    </div>
    <a routerLink="/" class="btn btn-ghost text-2xl font-black italic tracking-tighter gap-0">
      TRUCK<span class="text-primary">LOG</span>
    </a>
  </div>

  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1 gap-2 font-bold uppercase text-xs">
      <li><a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-primary">Dashboard</a></li>
      <li><a routerLink="/jobs" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-primary">Historial</a></li>
    </ul>
  </div>

  <div class="navbar-end gap-2">
    
    @if (authService.isAuthenticated()) {
      <button class="btn btn-ghost btn-circle">
        <div class="indicator">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
          <span class="badge badge-xs badge-primary indicator-item"></span>
        </div>
      </button>

      <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-ghost btn-circle avatar online">
          <div class="w-10 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
            <img alt="Avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" />
          </div>
        </label>
        <ul tabindex="0" class="mt-3 z-1 p-2 shadow menu menu-sm dropdown-content bg-base-200 rounded-box w-52 border border-white/5">
          <li class="menu-title opacity-50">Conductor</li>
          <li><a routerLink="/profile">Mi Perfil</a></li>
          <li><a>Ajustes de VTC</a></li>
          <div class="divider my-1 opacity-20"></div>
          <li><a (click)="logout()" class="text-error font-bold">Cerrar Sesión</a></li>
        </ul>
      </div>
    } @else {
      <a routerLink="/login" class="btn btn-ghost btn-sm font-bold uppercase">Login</a>
      <a routerLink="/register" class="btn btn-primary btn-sm font-black uppercase px-6">Unirse</a>
    }

  </div>
</div>

<div class="h-20"></div>
